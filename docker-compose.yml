services:
  mongodb:
    image: mongo:7-jammy
    container_name: forecastiq-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecastiq-backend
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CORS_ORIGIN=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/inventory_forecaster
      - JWT_SECRET=production_super_secret_jwt_key_at_least_32_chars!
      - JWT_EXPIRES_IN=7d
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forecastiq-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend

volumes:
  mongodb_data:

