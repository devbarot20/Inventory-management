<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="fiq-bg-full" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4F46E5" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#7C3AED" />
    </linearGradient>
    <linearGradient id="fiq-accent-full" x1="10" y1="70" x2="70" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="60%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>
    <linearGradient id="fiq-text-iq" x1="220" y1="20" x2="260" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon (80x80 box, offset x=4, y=4) -->
  <g transform="translate(4, 4) scale(0.72)">
    <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#fiq-bg-full)" />
    <rect x="3" y="3" width="94" height="94" rx="25" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
    <circle cx="24" cy="24" r="2" fill="#FFFFFF" fill-opacity="0.25" />
    <circle cx="36" cy="24" r="2" fill="#FFFFFF" fill-opacity="0.25" />
    <circle cx="24" cy="36" r="2" fill="#FFFFFF" fill-opacity="0.25" />
    <rect x="24" y="56" width="11" height="22" rx="4.5" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="41" y="42" width="11" height="36" rx="4.5" fill="#FFFFFF" fill-opacity="0.75" />
    <rect x="58" y="28" width="11" height="50" rx="4.5" fill="#FFFFFF" />
    <path d="M20 62 C 32 58, 44 44, 58 32 L 74 18" stroke="url(#fiq-accent-full)" stroke-width="5" stroke-linecap="round" />
    <path d="M62 16 L 80 18 L 78 36" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="77" cy="21" r="3.5" fill="#38BDF8" />
    <circle cx="77" cy="21" r="6.5" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7" />
  </g>

  <!-- Wordmark Text -->
  <text x="88" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#0F172A">
    Forecast<tspan fill="url(#fiq-text-iq)">IQ</tspan>
  </text>
  <text x="89" y="64" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.8" fill="#64748B" text-transform="uppercase">
    Inventory Demand Forecaster
  </text>
</svg>
